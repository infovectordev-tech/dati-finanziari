name: Aggiorna dati Hybrid (Cloudflare R2)

on:
  workflow_dispatch:
  schedule:
    # --- 8 ESECUZIONI AL GIORNO (Orari UTC) ---
    # Nota: L'Italia è UTC+1 (inverno) o UTC+2 (estate)
    
    # 1. Notte fonda / Apertura Asia (Esistente)
    - cron: '10 0 * * *'  
    
    # 2. Mattina presto (circa 05:00 IT)
    - cron: '0 4 * * *'    
    
    # 3. Apertura Europa (Esistente)
    - cron: '10 7 * * *'   
    
    # 4. Metà mattina Europa (circa 11:00 IT)
    - cron: '0 10 * * *'    
    
    # 5. Pre-market USA / Pranzo (circa 13:30 IT)
    - cron: '30 12 * * *'   
    
    # 6. Apertura USA (Esistente)
    - cron: '40 13 * * *'   
    
    # 7. Chiusura Europa / Metà seduta USA (Esistente)
    - cron: '30 16 * * *'  
    
    # 8. Chiusura USA (circa 21:30 IT)
    - cron: '3 20 * * *'   

    # 9. Per gli asset h24 come bitcoin e forex (circa 22:40 IT)
    - cron: '40 21 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Upgrade pip, setuptools e wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          # Librerie base e scientifiche
          pip install --no-cache-dir --upgrade numpy pandas scipy statsmodels

          # Librerie di rete, finanza e Cloudflare R2 (aggiunto boto3)
          pip install --no-cache-dir --upgrade yfinance==0.2.63 requests urllib3 feedparser lxml boto3

          # Analisi tecnica, HTML e NLP (rimossi pacchetti ML pesanti e argostranslate)
          pip install --no-cache-dir --upgrade ta beautifulsoup4 nltk

          # spaCy (mantenuto per retrocompatibilità come da tuo script)
          pip install --no-cache-dir --prefer-binary spacy==3.7.2

      - name: Download NLP models (Spacy & NLTK)
        run: |
          # Scarica il modello Spacy
          python -m spacy download en_core_web_sm-3.7.1
          
          # Scarica il lessico VADER per NLTK (per l'Hybrid Score)
          python -m nltk.downloader vader_lexicon

      - name: Debug versions
        run: |
          python - <<'EOF'
          import yfinance, requests, boto3, numpy, pandas, spacy, scipy, statsmodels, nltk
          print("yfinance =", yfinance.__version__)
          print("boto3 =", boto3.__version__)
          print("numpy =", numpy.__version__)
          print("pandas =", pandas.__version__)
          print("spacy =", spacy.__version__)
          print("nltk =", nltk.__version__)
          EOF

      - name: Run Hybrid Prediction Script
        env:
          # Passaggio delle chiavi da GitHub Secrets allo script Python
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          
        # Esegue il nuovo script
        run: python scripts/predict_hybrid.py
