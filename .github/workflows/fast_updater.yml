name: Fast Price Updater

on:
  schedule:
    - cron: '7,37 * * * *'   # backup: se la catena si rompe, riparte entro 30 min
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: live-price-updater
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # rete di sicurezza, sotto il limite GitHub di 360

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: pip install requests boto3

      - name: Esegui Updater (max 5h40m)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: timeout --kill-after=60 20400 python -u scripts/fast_updater.py

      - name: Rilancia il workflow
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 15
          gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
